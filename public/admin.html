
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>Premium Video Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h2{font-size:21px;margin:0}
small,.muted{color:#aaa}
.panel{background:#171313;border:1px solid #382626;border-radius:14px;padding:16px;margin-bottom:16px}
h3{font-size:16px;margin:0 0 15px}
input,textarea,select{
 width:100%;padding:12px;margin:6px 0 12px;
 background:#0e0e0e;border:1px solid #443333;
 color:white;border-radius:8px;font-size:14px
}
textarea{min-height:85px;resize:vertical}
label{font-size:12px;color:#c9baba}
button{
 padding:11px 15px;border:0;border-radius:8px;
 background:linear-gradient(100deg,#ff303d,#ff8126);
 color:white;font-weight:bold;cursor:pointer
}
button.secondary{background:#302222;border:1px solid #563838}
button.danger{background:#8d2028}
button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#211616;border:1px solid #4b2929;border-radius:12px;padding:15px}
.stat strong{display:block;font-size:25px;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.video{
 display:flex;gap:12px;padding:12px 0;
 border-bottom:1px solid #392929;align-items:center
}
.video img{width:95px;height:65px;object-fit:cover;border-radius:8px;background:#333}
.video-info{flex:1;min-width:0}
.video-info b{display:block;font-size:13px;overflow-wrap:anywhere}
.video-info small{font-size:11px}
.video-actions{display:flex;gap:5px}
.video-actions button{padding:8px;font-size:11px}
#app{display:none}
#status{font-size:12px;margin:10px 0;color:#ffb47c;white-space:pre-wrap}
hr{border:0;border-top:1px solid #382626;margin:18px 0}
@media(max-width:500px){.video{flex-wrap:wrap}.video-actions{width:100%}}
</style>
</head>
<body>
<div class="wrap">

<header>
 <div>
  <h2>🔥 Premium Video</h2>
  <small>Administration Dashboard</small>
 </div>
 <button class="secondary" onclick="logout()">Logout</button>
</header>

<div id="login" class="panel">
 <h3>Admin Login</h3>
 <label>Admin Key</label>
 <input id="adminKey" type="password" placeholder="Enter your ADMIN_KEY">
 <button onclick="login()">Login</button>
 <div id="loginStatus"></div>
</div>

<div id="app">

<div class="grid">
 <div class="stat">Total Users<strong id="totalUsers">0</strong></div>
 <div class="stat">Total Videos<strong id="totalVideos">0</strong></div>
</div>

<div class="panel" style="margin-top:16px">
 <h3>⚙️ App Settings</h3>

 <label>App Name</label>
 <input id="appName" placeholder="Premium Video">

 <label>Promotional Channel Name</label>
 <input id="promoName" placeholder="Promotional Channel">

 <label>Promotional Channel Link</label>
 <input id="promoUrl" placeholder="https://t.me/yourchannel">

 <hr>
 <h3>🎁 50 Ads Reward</h3>

 <label>Required Ads</label>
 <input id="rewardAds" type="number" min="1" max="1000" value="50">

 <label>Reward Amount</label>
 <input id="rewardAmount" type="number" min="0" value="1">

 <label>Reward Type</label>
 <select id="rewardType">
  <option value="credit">Credit</option>
  <option value="balance">Balance</option>
  <option value="points">Points</option>
 </select>

 <hr>
 <h3>👥 Referral Settings</h3>
 <label>Referral Reward</label>
 <input id="referralReward" type="number" min="0" value="1">

 <label>Referral System</label>
 <select id="referralEnabled">
  <option value="true">Enabled</option>
  <option value="false">Disabled</option>
 </select>

 <hr>
 <h3>📢 Advertising Network</h3>

 <label>Select Network</label>
 <select id="adNetwork">
  <option value="monetag">Monetag</option>
  <option value="gigapub">GigaPub</option>
  <option value="adsgram">AdsGram</option>
 </select>

 <label>Monetag Zone ID</label>
 <input id="monetagZone" placeholder="Monetag Zone ID">

 <label>GigaPub Zone ID</label>
 <input id="gigapubZone" placeholder="GigaPub Zone ID">

 <label>AdsGram Block ID</label>
 <input id="adsgramZone" placeholder="AdsGram Block ID">

 <label>Default Ads Per Video</label>
 <input id="defaultAds" type="number" min="1" max="100" value="2">

 <button onclick="saveSettings()">Save All Settings</button>
</div>

<div class="panel">
 <h3>📂 Video Categories</h3>
 <label>Categories (one per line: category-id | Category Name)</label>
 <textarea id="categories" placeholder="premium | Premium&#10;classic | Classic"></textarea>
 <button onclick="saveCategories()">Save Categories</button>
</div>

<div class="panel">
 <h3>🎬 Add / Edit Video</h3>
 <input type="hidden" id="videoId">

 <label>Video Title</label>
 <input id="videoTitle" placeholder="Enter video title">

 <label>Description</label>
 <textarea id="videoDescription" placeholder="Video description"></textarea>

 <label>Thumbnail Image URL</label>
 <input id="videoThumbnail" placeholder="https://example.com/image.jpg">

 <label>Video URL</label>
 <input id="videoUrl" placeholder="Video link or Telegram video link">

 <label>Category</label>
 <select id="videoCategory">
  <option value="premium">Premium</option>
  <option value="classic">Classic</option>
 </select>

 <label>Ads Required for this Video</label>
 <input id="videoAds" type="number" min="1" max="100" value="2">

 <div class="row">
  <button onclick="saveVideo()">Save Video</button>
  <button class="secondary" onclick="clearVideo()">Clear</button>
 </div>
 <div id="videoStatus"></div>
</div>

<div class="panel">
 <div class="row" style="align-items:center">
  <h3 style="margin:0">📺 Manage Videos</h3>
  <button class="secondary" onclick="loadVideos()">Refresh</button>
 </div>
 <div id="videoList" class="muted" style="margin-top:15px">Loading...</div>
</div>

<div class="panel">
 <h3>📣 Broadcast Message</h3>
 <label>Message or Link</label>
 <textarea id="broadcastMessage" placeholder="Write a message for all bot users..."></textarea>
 <button onclick="sendBroadcast()">Send Broadcast</button>
 <div id="broadcastStatus"></div>
</div>

<div id="status"></div>
</div>
</div>

<script>
const API="";
let key=sessionStorage.getItem("pv_admin_key")||"";

function authHeaders(){
 return {
  "Content-Type":"application/json",
  "x-admin-key":key
 };
}

async function api(path,options={}){
 const response=await fetch(API+path,{
  ...options,
  headers:{...authHeaders(),...(options.headers||{})}
 });
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(data.error||"Request failed");
 return data;
}

function logout(){
 sessionStorage.removeItem("pv_admin_key");
 key="";
 location.reload();
}

async function login(){
 key=document.getElementById("adminKey").value.trim();
 if(!key)return alert("Admin Key required");
 try{
  await api("/api/admin/dashboard");
  sessionStorage.setItem("pv_admin_key",key);
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  await loadAll();
 }catch(e){
  document.getElementById("loginStatus").textContent=e.message;
  key="";
 }
}

async function loadAll(){
 await Promise.all([
  loadDashboard(),
  loadSettings(),
  loadVideos()
 ]);
}

async function loadDashboard(){
 const d=await api("/api/admin/dashboard");
 document.getElementById("totalUsers").textContent=d.totalUsers;
 document.getElementById("totalVideos").textContent=d.totalVideos;
}

async function loadSettings(){
 const r=await fetch("/api/settings");
 const d=await r.json();
 if(!d.success)return;
 const s=d.settings;

 document.getElementById("appName").value=s.appName||"Premium Video";
 document.getElementById("promoName").value=s.promotionalChannel?.name||"";
 document.getElementById("promoUrl").value=s.promotionalChannel?.url||"";

 document.getElementById("rewardAds").value=s.reward?.adsRequired||50;
 document.getElementById("rewardAmount").value=s.reward?.rewardAmount??1;
 document.getElementById("rewardType").value=s.reward?.rewardType||"credit";

 document.getElementById("referralReward").value=s.referral?.rewardPerReferral??1;
 document.getElementById("referralEnabled").value=String(s.referral?.enabled!==false);

 document.getElementById("adNetwork").value=s.ads?.activeNetwork||"monetag";
 document.getElementById("monetagZone").value=s.ads?.monetagZoneId||"";
 document.getElementById("gigapubZone").value=s.ads?.gigapubZoneId||"";
 document.getElementById("adsgramZone").value=s.ads?.adsgramBlockId||"";
 document.getElementById("defaultAds").value=s.ads?.adsPerVideo||2;

 document.getElementById("categories").value=
  (s.categories||[]).filter(c=>c.id!=="all")
  .map(c=>`${c.id} | ${c.name}`).join("\n");
}

async function saveSettings(){
 try{
  await api("/api/admin/settings",{
   method:"PUT",
   body:JSON.stringify({
    appName:document.getElementById("appName").value.trim(),
    promotionalChannel:{
     name:document.getElementById("promoName").value.trim(),
     url:document.getElementById("promoUrl").value.trim()
    },
    reward:{
     enabled:true,
     adsRequired:Number(document.getElementById("rewardAds").value),
     rewardAmount:Number(document.getElementById("rewardAmount").value),
     rewardType:document.getElementById("rewardType").value
    },
    referral:{
     enabled:document.getElementById("referralEnabled").value==="true",
     rewardPerReferral:Number(document.getElementById("referralReward").value)
    },
    ads:{
     activeNetwork:document.getElementById("adNetwork").value,
     monetagZoneId:document.getElementById("monetagZone").value.trim(),
     gigapubZoneId:document.getElementById("gigapubZone").value.trim(),
     adsgramBlockId:document.getElementById("adsgramZone").value.trim(),
     adsPerVideo:Number(document.getElementById("defaultAds").value)
    }
   })
  });
  alert("Settings saved successfully!");
 }catch(e){alert(e.message)}
}

async function saveCategories(){
 try{
  const lines=document.getElementById("categories").value.split("\n");
  const categories=[{id:"all",name:"All Videos",enabled:true}];

  lines.forEach(line=>{
   if(!line.trim())return;
   const parts=line.split("|");
   if(parts.length<2)throw new Error("Use id | Category Name format");
   const id=parts[0].trim().toLowerCase().replace(/[^a-z0-9_-]/g,"");
   const name=parts.slice(1).join("|").trim();
   if(!id||!name)throw new Error("Invalid category");
   categories.push({id,name,enabled:true});
  });

  await api("/api/admin/settings",{
   method:"PUT",
   body:JSON.stringify({categories})
  });
  await loadSettings();
  alert("Categories saved!");
 }catch(e){alert(e.message)}
}

async function loadVideos(){
 const box=document.getElementById("videoList");
 box.textContent="Loading videos...";
 try{
  const r=await fetch("/api/videos?page=1&category=all");
  const d=await r.json();
  if(!d.success)throw new Error("Unable to load videos");

  box.innerHTML="";
  if(!d.videos.length){
   box.textContent="No videos found";
   return;
  }

  d.videos.forEach(v=>{
   const row=document.createElement("div");
   row.className="video";

   const img=document.createElement("img");
   img.src=v.thumbnail||"";
   img.onerror=()=>img.style.display="none";

   const info=document.createElement("div");
   info.className="video-info";

   const title=document.createElement("b");
   title.textContent=v.title||"Untitled";

   const meta=document.createElement("small");
   meta.textContent=(v.categoryId||"")+" • "+(v.adsRequired||2)+" Ads";

   info.append(title,meta);

   const actions=document.createElement("div");
   actions.className="video-actions";

   const edit=document.createElement("button");
   edit.className="secondary";
   edit.textContent="Edit";
   edit.onclick=()=>editVideo(v);

   const del=document.createElement("button");
   del.className="danger";
   del.textContent="Delete";
   del.onclick=()=>deleteVideo(v.id);

   actions.append(edit,del);
   row.append(img,info,actions);
   box.appendChild(row);
  });
 }catch(e){box.textContent=e.message}
}

function editVideo(v){
 document.getElementById("videoId").value=v.id;
 document.getElementById("videoTitle").value=v.title||"";
 document.getElementById("videoDescription").value=v.description||"";
 document.getElementById("videoThumbnail").value=v.thumbnail||"";
 document.getElementById("videoUrl").value=v.videoUrl||"";
 document.getElementById("videoCategory").value=v.categoryId||"premium";
 document.getElementById("videoAds").value=v.adsRequired||2;
 window.scrollTo({top:document.getElementById("videoTitle").offsetTop-30,behavior:"smooth"});
}

function clearVideo(){
 ["videoId","videoTitle","videoDescription","videoThumbnail","videoUrl"]
 .forEach(id=>document.getElementById(id).value="");
 document.getElementById("videoAds").value=2;
 document.getElementById("videoCategory").value="premium";
}

async function saveVideo(){
 const id=document.getElementById("videoId").value;
 const body={
  title:document.getElementById("videoTitle").value.trim(),
  description:document.getElementById("videoDescription").value.trim(),
  thumbnail:document.getElementById("videoThumbnail").value.trim(),
  videoUrl:document.getElementById("videoUrl").value.trim(),
  categoryId:document.getElementById("videoCategory").value,
  adsRequired:Number(document.getElementById("videoAds").value)
 };

 if(!body.title||!body.thumbnail||!body.videoUrl){
  alert("Title, Thumbnail and Video URL are required");
  return;
 }

 try{
  await api(id?"/api/admin/videos/"+encodeURIComponent(id):"/api/admin/videos",{
   method:id?"PUT":"POST",
   body:JSON.stringify(body)
  });
  document.getElementById("videoStatus").textContent="Video saved successfully!";
  clearVideo();
  await loadVideos();
  await loadDashboard();
 }catch(e){
  document.getElementById("videoStatus").textContent=e.message;
 }
}

async function deleteVideo(id){
 if(!confirm("Are you sure you want to delete this video?"))return;
 try{
  await api("/api/admin/videos/"+encodeURIComponent(id),{method:"DELETE"});
  await loadVideos();
  await loadDashboard();
 }catch(e){alert(e.message)}
}

async function sendBroadcast(){
 const message=document.getElementById("broadcastMessage").value.trim();
 if(!message)return alert("Write a message first");
 if(!confirm("Send this message to all bot users?"))return;

 const box=document.getElementById("broadcastStatus");
 box.textContent="Sending...";
 try{
  const d=await api("/api/admin/broadcast",{
   method:"POST",
   body:JSON.stringify({message})
  });
  box.textContent=`Completed. Sent: ${d.sent}, Failed: ${d.failed}`;
 }catch(e){box.textContent=e.message}
}

if(key){
 document.getElementById("adminKey").value=key;
 login();
}
</script>
</body>
</html>
